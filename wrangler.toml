# Cloudflare Pages-configuratie voor ZIB.
# Stappen staan in docs/CLOUD.md. Vul database_id in na `npx wrangler d1 create zib --jurisdiction=eu`.
name = "zib"
pages_build_output_dir = "./public"
compatibility_date = "2025-09-15"

[[d1_databases]]
binding = "DB"
database_name = "zib"
database_id = "VUL-HIER-HET-DATABASE-ID-IN"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "zib-documenten"
jurisdiction = "eu"

# Inloggen (Cloudflare Access) stel je in met drie versleutelde variabelen in het Pages-dashboard
# (Settings → Variables and Secrets → Add → Encrypt), niet in dit bestand: dit bestand is de bron
# van waarheid voor de configuratie en zou ze in het dashboard op alleen-lezen zetten.
#   ACCESS_TEAM_DOMAIN  team-domein van Cloudflare Zero Trust, bijv. "jouwteam.cloudflareaccess.com"
#   ACCESS_AUD          Application Audience (AUD) Tag van de Access-applicatie
#   ALLOWED_EMAILS      optioneel slot: alleen deze e-mailadressen (komma-gescheiden) bij de gegevens
