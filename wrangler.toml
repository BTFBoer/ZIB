# Cloudflare Pages-configuratie voor ZIB.
# Stappen staan in docs/CLOUD.md. Vul database_id in na `npx wrangler d1 create zib --jurisdiction=eu`.
name = "zib"
pages_build_output_dir = "./public"
compatibility_date = "2025-09-15"

[[d1_databases]]
binding = "DB"
database_name = "zib"
database_id = "VUL-HIER-HET-DATABASE-ID-IN"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "zib-documenten"
jurisdiction = "eu"

[vars]
# Team-domein van Cloudflare Zero Trust, bijv. "jouwteam.cloudflareaccess.com"
ACCESS_TEAM_DOMAIN = ""
# Application Audience (AUD) Tag van de Access-applicatie
ACCESS_AUD = ""
