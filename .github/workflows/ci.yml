name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntaxcontrole
        run: |
          for f in $(find public/js functions -name "*.js"); do node --check "$f"; done
      - name: Rekenkern-tests
        run: npm test
